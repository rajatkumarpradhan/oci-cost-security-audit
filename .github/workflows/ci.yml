name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke run
        run: |
          python audit.py --cost-report fixtures/cost_report.csv --snapshot fixtures/tenancy_snapshot.json --output report.json
          python - <<'PY'
          import json
          r = json.load(open("report.json"))
          assert r["findings"], "expected findings on the bundled fixtures"
          assert r["cost_by_service"], "expected cost aggregation"
          print("smoke ok:", len(r["findings"]), "findings")
          PY
      - name: Severity gate behaves
        run: |
          python audit.py --cost-report fixtures/cost_report.csv --snapshot fixtures/tenancy_snapshot.json --fail-on CRITICAL && exit 1 || echo "gate failed as expected on CRITICAL findings"
